    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
         <link rel="stylesheet" href="{{url_for('static', filename='css/dashboard.css')}}">
    </head>
    <body>
        <p>Bienvenido {{usuario.nombre}}</p>

        <a href="/nueva">Nueva mision</a>
        <a href="/cerrar_sesion">Cerrar Sesion</a>
        <br>
        <table border="1">
            <tr>
                <th>Nombre</th>
                <th>Lider</th>
                <th>Fecha</th>
                <th>Voluntarios necesarios</th>
                <th>Acciom</th>
            </tr>
            {% for mision in misiones %}
            <tr>
                <td>{{mision.nombre}}</td>
                <td>{{mision.nombre_lider}}</td>
                <td>{{mision.fecha}}</td>
                <td>{{mision.voluntariados_necesarios}}</td>
            
                <td>
                    <a href="/ver/{{mision.id}}">Ver</a>
                
                    <a href="/editar/{{mision.id}}">Editar</a>
                    <a href="/borrar/{{mision.id}}">Borrar</a>        
                
                </td>
            </tr>
            {% endfor%}
        </table>
    </body>
    </html>
